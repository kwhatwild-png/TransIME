name: Build TransIME Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置系统自带 Android SDK 路径与协议
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 安装并配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 自动解压与定位 app 源码
        run: |
          echo "=== 1. 检查上传的文件 ==="
          ls -la
          
          # 如果检测到 zip 压缩包，云端自动一键解压！
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "发现工程压缩包 $ZIP_FILE，正在自动解压..."
            unzip -o "$ZIP_FILE"
          fi
          
          # 自动确保 app 文件夹在根目录
          if [ ! -d "app" ]; then
            SUB_APP=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
            if [ -n "$SUB_APP" ]; then
              echo "在子目录中找到了 app 源码: $SUB_APP，自动同步到根目录..."
              cp -r "$SUB_APP" ./app
            fi
          fi
          
          echo "=== 2. 最终确认目录 ==="
          ls -la

      - name: 执行编译打包 (无守护进程模式)
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传打包好的 APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TransIME-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
