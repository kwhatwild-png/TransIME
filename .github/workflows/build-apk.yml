name: Build AI-IME Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Android SDK 路径与 AndroidX 属性
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 安装并配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 自动解压与定位 app 源码
        run: |
          echo "=== 1. 检查上传的文件 ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "发现工程压缩包 $ZIP_FILE，正在自动解压..."
            unzip -o "$ZIP_FILE"
          fi
          
          if [ ! -d "app" ]; then
            SUB_APP=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
            if [ -n "$SUB_APP" ]; then
              echo "在子目录中找到了 app 源码: $SUB_APP，自动同步到根目录..."
              cp -r "$SUB_APP" ./app
            fi
          fi
          
          echo "=== 2. 确认工程结构 ==="
          ls -la
          
          if [ ! -d "app" ]; then
            echo "❌ 错误：仓库中缺少 app 源码文件夹！"
            exit 1
          fi

      - name: 执行编译打包 (无守护进程模式)
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传打包好的 APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-IME-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
