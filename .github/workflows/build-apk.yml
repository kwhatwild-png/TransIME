name: Build TransIME Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装并配置官方 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 检查文件并打包
        run: |
          ls -la
          if [ -d "app" ]; then
            gradle assembleDebug --stacktrace
          else
            TARGET=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET" ]; then
              cd "$TARGET"
              gradle assembleDebug --stacktrace
            else
              echo "❌ 缺少 app 源码文件夹"
              exit 1
            fi
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TransIME-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
