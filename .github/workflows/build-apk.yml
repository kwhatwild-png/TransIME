name: Build VietDict Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Android SDK 属性
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 安装与配置 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 自动定位与对齐工程结构
        run: |
          echo "=== 1. 检查根目录文件结构 ==="
          ls -la
          
          # 如果仓库直接上传了 zip 文件，自动解压
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "检测到工程压缩包 $ZIP_FILE，正在解压..."
            unzip -o "$ZIP_FILE" || true
          fi

          # 如果 app 目录处于子目录中，自动同步到根目录
          if [ ! -d "app" ]; then
            SUB_APP=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
            if [ -n "$SUB_APP" ]; then
              echo "在子目录中发现 app 源码: $SUB_APP，同步到根目录..."
              cp -r "$SUB_APP" ./app
            fi
          fi

          if [ ! -d "app" ]; then
            echo "❌ 错误：仓库中未找到包含核心代码的 app 目录！"
            exit 1
          fi

      - name: 执行编译打包 (生成 Debug APK)
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传打包生成的 APK 文件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VietDict-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
